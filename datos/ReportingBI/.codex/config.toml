# Configuración de Codex para ReportingBI (datos/ReportingBI/) cuando Codex corre en WSL.
# Para usarla, renómbrala a config.toml. Única diferencia con la de Windows: el MCP se
# arranca con cmd.exe (en WSL no existe «cmd»), que lo ejecuta como programa de Windows
# para que llegue a Power BI Desktop. Necesita Node.js instalado en Windows.
#
# Codex solo carga este fichero si el proyecto está marcado como de confianza.
# Tiene prioridad sobre ~/.codex/config.toml. Las claves de proveedor, perfiles
# y notificaciones se ignoran aquí: van en la configuración de usuario.

# MCP oficial de Microsoft para modelos de Power BI (solo Windows).
# Se conecta al modelo abierto en Power BI Desktop, a una carpeta PBIP o a un área de
# trabajo de Fabric. La primera vez pide aceptar su licencia (EULA): acéptala tú.
[mcp_servers.powerbi-modeling]
command = "cmd.exe"
# UTF-8 evita que los mensajes localizados del MCP cierren el transporte de Codex.
args = ["/d", "/c", "chcp 65001 >nul && npx -y @microsoft/powerbi-modeling-mcp@latest --start"]
startup_timeout_sec = 120

# MCP remoto de Power BI para consultar modelos ya publicados (preview). Necesita que el
# administrador del tenant lo tenga habilitado. Descomentar para la prueba en el servicio.
#
# [mcp_servers.powerbi-remote]
# url = "https://api.fabric.microsoft.com/v1/mcp/powerbi"

# MCP de base de datos (MCP Toolbox for Databases) para consultar NAVDEMO en lenguaje natural.
# Usa el usuario lectura (db/mcp/lectura.sql), que solo lee: la protección está en la
# base, porque el MCP incluye execute_sql. La contraseña no va aquí: Codex la toma de la
# variable de entorno MSSQL_PASSWORD. No necesita Windows: en WSL se ejecuta con npx de Linux.
# Apagado por defecto para no cargarlo en los issues. Para la demo:
#   codex -c mcp_servers.navdemo-db.enabled=true
[mcp_servers.navdemo-db]
enabled = false
command = "npx"
args = ["-y", "@toolbox-sdk/server@1.18.0", "--prebuilt=mssql", "--stdio"]
env_vars = ["MSSQL_PASSWORD"]
startup_timeout_sec = 60

[mcp_servers.navdemo-db.env]
MSSQL_HOST = "127.0.0.1"
MSSQL_PORT = "14330"
MSSQL_DATABASE = "NAVDEMO"
MSSQL_USER = "lectura"
